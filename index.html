<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لانچر پرمیوم شطرنج</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:sans-serif;
}

body{

    background:#044d24;
    color:white;

}

/* کادر توضیح */

.header{

    width:90%;
    margin:30px auto;

    background:#13263d;

    border:2px solid #3fa9ff;

    border-radius:15px;

    padding:25px;

    text-align:center;

    box-shadow:0 0 20px rgba(0,150,255,.25);

}

.header h1{

    color:#55c8ff;
    margin-bottom:15px;

}

.header p{

    font-size:18px;
    color:#d5e8ff;

}

/* بخش گزینه ها */

.menu{

    width:90%;

    margin:auto;

    display:grid;

    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));

    gap:20px;

    margin-bottom:40px;

}

/* هر گزینه */

.box{

    background:#490615;

    border:2px solid #27910d;

    border-radius:12px;

    height:120px;

    display:flex;

    align-items:center;

    justify-content:center;

    text-decoration:none;

    color:white;

    font-size:24px;

    font-weight:bold;

    transition:.3s;

    box-shadow:0 0 15px rgba(14, 163, 39, 0.15);

}

.box:hover{

    background:#101950;

    transform:scale(1.05);

    box-shadow:0 0 25px #0d4b7e;

}

</style>

</head>

<body>

<div class="menu">

<a class="box" href="شطرنج اندی و لیلی.html" target="_blank">
شطرنج اندی و لیلی
</a>

<a class="box" href="شطرنج VIP.html" target="_blank">
شطرنج vip
</a>

<a class="box" href="شطرنج 701.html" target="_blank">
شطرنج شهیدان مزیدی
</a>

</div>

</body>
</html>
